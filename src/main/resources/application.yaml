# Spring Boot 기본 설정이다.
spring:
  # 애플리케이션 이름 설정이다.
  application:
    name: LINKY-BE_PROJECT

  # 운영 또는 로컬 실행 시 사용할 MySQL 데이터베이스 연결 설정이다.
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA와 Hibernate 동작 방식을 설정한다.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # 파일 업로드 요청의 허용 크기를 설정한다.
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# JWT 토큰 생성과 만료 시간을 설정한다.
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000          # 1시간 (ms)
  refresh-expiration: 1209600000  # 14일 (ms)

# 내장 서버 실행 포트를 설정한다.
server:
  port: 8080

# 유튜브 메타데이터 조회 API 키 설정이다.
youtube:
  api-key: ${YOUTUBE_API_KEY:dummy-key}

# Gemini API 호출에 필요한 키와 모델 설정이다.
gemini:
  api:
    key: ${GEMINI_API_KEY}
    classification-model: gemini-2.5-flash-lite
