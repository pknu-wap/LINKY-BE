# 테스트 실행 시 사용할 Spring Boot 설정이다.
spring:
  # 테스트 애플리케이션 이름 설정이다.
  application:
    name: LINKY-BE_PROJECT

  # 테스트 전용 인메모리 H2 데이터베이스 연결 설정이다.
  datasource:
    url: jdbc:h2:mem:linky_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 테스트에서 사용할 JPA와 Hibernate 동작 방식을 설정한다.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# 테스트에서는 Gemini API 키를 비워 외부 호출 의존성을 줄인다.
gemini:
  api:
    key:

# 테스트에서 사용할 유튜브 API 키 더미 값이다.
youtube:
  api-key: dummy-key
